<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>课堂签到 · 神经网络与深度学习</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
        radial-gradient(700px 400px at 50% -10%, rgba(37, 99, 235, 0.10), transparent 62%),
        radial-gradient(500px 300px at 90% 110%, rgba(124, 58, 237, 0.07), transparent 60%),
        #f6f8fc;
    color: #0f172a;
    min-height: 100vh;
    padding: 18px 16px 40px;
}
.wrap { max-width: 420px; margin: 0 auto; }
h1 { font-size: 20px; text-align:center; margin-bottom: 6px; font-family: 'Noto Serif SC', 'Songti SC', serif; }
.sub { text-align:center; font-size: 12px; color:#5b6474; margin-bottom: 22px; letter-spacing: .2em; }
.card {
    background: #ffffff;
    border: 1px solid rgba(15,23,42,0.10);
    box-shadow: 0 1px 3px rgba(15,23,42,.06);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
}
.card h2 { font-size: 15px; margin-bottom: 12px; color: #1d4ed8; }
input, select {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid rgba(15,23,42,0.20);
    background: #ffffff;
    color: #0f172a;
    font-size: 16px;
    outline: none;
    margin-bottom: 12px;
    appearance: none;
}
input:focus { border-color: #3b82f6; }
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(120deg,#38bdf8 0%,#2563eb 60%,#4f46e5 100%);
    cursor: pointer;
}
button:disabled { opacity:.45; }
button.ghost { background: #f1f5f9; color: #334155; font-weight: 400; }
.msg { text-align:center; font-size: 14px; min-height: 20px; margin-top: 10px; }
.msg.ok { color: #16a34a; }
.msg.err { color: #dc2626; }
.datalist-wrap { position: relative; }
.suggest {
    position: absolute; left:0; right:0; top: 100%;
    background:#ffffff; border:1px solid rgba(15,23,42,0.15);
    border-radius: 10px; margin-top:4px; max-height: 180px; overflow-y:auto; z-index: 9;
}
.suggest div { padding: 10px 14px; font-size: 15px; border-bottom: 1px solid rgba(15,23,42,0.07); cursor:pointer; }
.suggest div:active { background: rgba(59,130,246,0.14); }
.q-text { font-size: 17px; line-height: 1.7; margin-bottom: 14px; }
.opt {
    display:block; width:100%; text-align:left; padding: 13px 15px;
    border-radius: 12px; border: 1px solid rgba(15,23,42,0.18);
    background: #f8fafc; color:#0f172a;
    font-size: 15px; margin-bottom: 10px; font-weight: 400;
}
.opt.picked { border-color:#4f46e5; background: rgba(79,70,229,0.10); }
.opt.correct { border-color:#16a34a; background: rgba(22,163,74,0.12); }
.qstatus { font-size: 13px; color:#5b6474; text-align:center; }
.badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px;
    background: rgba(22,163,74,0.12); color:#15803d; margin-bottom: 10px; }
.empty { text-align:center; color:#5b6474; font-size: 14px; padding: 26px 0; }
.footer { text-align:center; font-size: 11px; color:#5b6474; margin-top: 30px; }
</style>
<link rel="stylesheet" href="css/theme-pro.css?v=3">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
<div class="wrap">
    <h1>📚 神经网络与深度学习</h1>
    <div class="sub">课堂签到与实时答题</div>

    <div class="card" id="signinCard">
        <h2>✋ 签到</h2>
        <input type="text" id="nameInput" placeholder="输入姓名" autocomplete="off">
        <div class="suggest" id="suggest" style="display:none"></div>
        <input type="text" id="sidInput" placeholder="学号（选填）">
        <button id="signinBtn">签 到</button>
        <div class="msg" id="signMsg"></div>
    </div>

    <div class="card" id="qCard" style="display:none">
        <h2>📝 实时答题</h2>
        <div id="qBody"><div class="empty">暂无进行中的题目，等待老师出题…</div></div>
    </div>

    <div class="card" id="meCard" style="display:none">
        <span class="badge" id="meBadge"></span>
        <div class="qstatus" id="meInfo"></div>
    </div>

    <div class="footer">沈阳工业大学人工智能学院 · 智慧课程系统</div>
</div>

    <script src="js/pb.js?v=4"></script>
<script>
(function () {
    const qs = new URLSearchParams(location.search);
    const cls = qs.get('class') || '默认班级';
    // 统一走 js/pb.js：它把旧 /api/* 翻译成 PocketBase 集合调用。
    // 签到页是匿名场景，所以这里不依赖登录态。
    const call = (p, b) => window.PB.api(p, b ? { method: 'POST', body: b } : {});

    const nameInput = document.getElementById('nameInput');
    const sidInput = document.getElementById('sidInput');
    const signinBtn = document.getElementById('signinBtn');
    const signMsg = document.getElementById('signMsg');
    const suggest = document.getElementById('suggest');
    const qCard = document.getElementById('qCard');
    const qBody = document.getElementById('qBody');
    const meCard = document.getElementById('meCard');
    const meBadge = document.getElementById('meBadge');
    const meInfo = document.getElementById('meInfo');

    let me = localStorage.getItem('sig_name_' + cls) || '';
    let roster = [];
    let myAnswer = null;   // {qid, choice}
    let curQ = null;

    nameInput.value = me;
    if (me) {
        signinBtn.textContent = '重新签到';
        meCard.style.display = '';
        meBadge.textContent = '已签到：' + me;
    }

    // 名单建议
    call('/api/state?class=' + encodeURIComponent(cls))
        .then(st => { roster = st.roster || []; })
        .catch(() => {});

    nameInput.addEventListener('input', () => {
        const v = nameInput.value.trim();
        if (!v || !roster.length) { suggest.style.display = 'none'; return; }
        const hits = roster.filter(n => n.includes(v)).slice(0, 5);
        if (!hits.length) { suggest.style.display = 'none'; return; }
        suggest.innerHTML = hits.map(n => '<div data-n="' + n + '">' + n + '</div>').join('');
        suggest.style.display = '';
    });
    suggest.addEventListener('click', e => {
        if (e.target.dataset.n) {
            nameInput.value = e.target.dataset.n;
            suggest.style.display = 'none';
        }
    });

    signinBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) { signMsg.textContent = '请输入姓名'; signMsg.className = 'msg err'; return; }
        signinBtn.disabled = true;
        call('/api/signin', { class: cls, name: name, sid: sidInput.value.trim() })
        .then(res => {
            signinBtn.disabled = false;
            if (res.ok) {
                me = name;
                localStorage.setItem('sig_name_' + cls, name);
                // 写入学情追踪身份（track.js 上报行为时携带）
                try { localStorage.setItem('zhkc_identity', JSON.stringify({ name: name, className: cls })); } catch (e) {}
                signMsg.textContent = '✓ ' + res.msg;
                signMsg.className = 'msg ok';
                signinBtn.textContent = '已签到';
                meCard.style.display = '';
                meBadge.textContent = '已签到：' + me;
                if (res.hasQuestion) pollOnce();
            } else {
                signMsg.textContent = res.msg || '签到失败';
                signMsg.className = 'msg err';
            }
        })
        .catch(() => {
            signinBtn.disabled = false;
            signMsg.textContent = '网络错误，请重试';
            signMsg.className = 'msg err';
        });
    });

    // ---------- 实时答题轮询 ----------
    function renderQuestion() {
        if (!curQ) {
            qBody.innerHTML = '<div class="empty">暂无进行中的题目，等待老师出题…</div>';
            return;
        }
        let html = '<div class="q-text">' + curQ.text + '</div>';
        (curQ.options || []).forEach((opt, i) => {
            const picked = myAnswer && myAnswer.qid === curQ.id && myAnswer.choice === i;
            html += '<button class="opt' + (picked ? ' picked' : '') + '" data-i="' + i + '">'
                + String.fromCharCode(65 + i) + '. ' + opt + '</button>';
        });
        html += '<div class="qstatus" id="qStatus">' + (myAnswer && myAnswer.qid === curQ.id ? '✓ 已提交，可修改' : '点击选项提交答案') + '</div>';
        qBody.innerHTML = html;
        qBody.querySelectorAll('.opt').forEach(btn => {
            btn.addEventListener('click', () => submitAnswer(parseInt(btn.dataset.i)));
        });
    }

    function submitAnswer(choice) {
        if (!curQ) return;
        call('/api/answer', { class: cls, name: me, qid: curQ.id, choice: choice })
        .then(res => {
            if (res.ok) {
                myAnswer = { qid: curQ.id, choice: choice };
                const st = document.getElementById('qStatus');
                if (st) st.textContent = '✓ 已提交';
                renderQuestion();
            }
        })
        .catch(() => {});
    }

    function pollOnce() {
        call('/api/state?class=' + encodeURIComponent(cls))
            .then(st => {
                roster = st.roster || roster;
                const newQ = st.current;
                if (!newQ) { curQ = null; renderQuestion(); return; }
                if (!curQ || curQ.id !== newQ.id) {
                    curQ = newQ;
                    myAnswer = null;
                }
                renderQuestion();
                qCard.style.display = '';
            })
            .catch(() => {});
    }

    setInterval(pollOnce, 2500);
    pollOnce();
})();
</script>
</body>
</html>
